<!DOCTYPE html>
<html>

<head>
    <title>Internal Style Sheet</title>

    <style>
        * {
            margin: 2;
            padding: 10px;
        }

        #heading {
            color: rgb(210, 30, 165);
            text-align: center;
        }

        .text {
            color: aqua;
            font-size: 25px;
            text-align: center;
        }

        .important {
            color: brown;
            text-align: right;
        }

        ul {
            color: chartreuse;
            text-align: left;
        }
    </style>
</head>

<body>

    <h1 id="heading">Web Programming</h1>

    <p class="text">
        CSS is used in HTML for design and coloring in web development.
    </p>

    <i class="important">
        Be positive, nothing is impossible
    </i>

    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>

</body>

</html>
